version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gramai_postgres
    environment:
      POSTGRES_DB: gramai_db
      POSTGRES_USER: gramai
      POSTGRES_PASSWORD: gramai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramai -d gramai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    environment:
      DATABASE_URL: postgresql://gramai:gramai_pass@postgres:5432/gramai_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
